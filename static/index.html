<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Преобразование данных DSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Тема в духе порталов ГРЧЦ / ЕРИР: тёмно-синий, светлый фон, сдержанные формы */
    :root {
      --bs-primary: #1a4a7a;
      --bs-primary-rgb: 26, 74, 122;
      --bs-success: #2d6a4f;
      --bs-success-rgb: 45, 106, 79;
      --bs-body-bg: #eef1f6;
      --bs-body-color: #1f2937;
      --bs-border-color: #c5cdd8;
      --bs-border-radius: 4px;
      --bs-border-radius-sm: 3px;
      --bs-font-sans-serif: "PT Sans", "Segoe UI", system-ui, sans-serif;
      --erir-header: #153d66;
    }
    body { min-height: 100vh; }
    .app-header {
      background: linear-gradient(180deg, var(--erir-header) 0%, #1a4a7a 100%);
      border-bottom: 3px solid #0f2d4a;
    }
    .app-header .navbar-brand { font-weight: 700; letter-spacing: 0.02em; }
    .app-header .subtitle { font-size: 0.8125rem; opacity: 0.85; }
    main { max-width: 40rem; }
    .card {
      border: 1px solid #d4dbe5;
      border-radius: var(--bs-border-radius);
      box-shadow: 0 1px 3px rgba(15, 45, 74, 0.08);
    }
    .card-header {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
      color: var(--erir-header);
      font-size: 0.9375rem;
    }
    .form-label { font-weight: 700; color: #374151; font-size: 0.875rem; }
    .combobox .form-control:focus {
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 0.2rem rgba(var(--bs-primary-rgb), 0.2);
    }
    .combobox-list {
      max-height: 14rem;
      overflow-y: auto;
      border-radius: var(--bs-border-radius-sm);
    }
    .combobox-list .dropdown-item.active,
    .combobox-list .dropdown-item:hover {
      background-color: #e8f0f8;
      color: #153d66;
    }
    .info-panel dt { font-weight: 700; color: #4b5563; }
    .info-panel dd { margin-bottom: 0.35rem; }
    #status:not(.d-none) { font-size: 0.875rem; }
    .btn-primary { --bs-btn-border-color: #153d66; }
    .processing .spinner-border { width: 1rem; height: 1rem; }
  </style>
</head>
<body class="d-flex flex-column">
  <header class="app-header navbar navbar-dark py-3 mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fs-5">Преобразование данных DSP</span>
      <div class="subtitle text-white-50 mt-1">Приведение выгрузок партнёров к шаблону загрузки</div>
    </div>
  </header>

  <main class="container flex-grow-1 pb-5">
    <div class="card">
      <div class="card-header">Загрузка и преобразование</div>
      <div class="card-body">
        <p class="text-muted small mb-4">Выберите DSP, укажите файл выгрузки, выполните преобразование и скачайте результат.</p>

        <div class="mb-3">
          <label for="partner-search" class="form-label">DSP</label>
          <div class="combobox position-relative">
            <input type="text" class="form-control" id="partner-search" autocomplete="off"
                   placeholder="Введите название…" aria-autocomplete="list" aria-controls="partner-list" />
            <ul id="partner-list" class="dropdown-menu combobox-list w-100 shadow-sm" hidden></ul>
          </div>
        </div>

        <div id="info" class="info-panel alert alert-light border mb-3 d-none" role="region"></div>

        <div class="mb-4">
          <label for="file" class="form-label">Файл выгрузки (.xlsx)</label>
          <input class="form-control" type="file" id="file" accept=".xlsx,.xlsm" required>
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary btn-lg" id="submit">Преобразовать</button>
          <button type="button" class="btn btn-success btn-lg" id="download" hidden>Скачать результат</button>
        </div>

        <div id="status" class="d-none" role="status"></div>
      </div>
    </div>
  </main>

  <footer class="container pb-4">
    <p class="text-muted small mb-0">Локальный сервис преобразования · стиль интерфейса ориентирован на порталы реестра (ЕРИР)</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const partnerSearch = document.getElementById('partner-search');
    const partnerList = document.getElementById('partner-list');
    const infoEl = document.getElementById('info');
    const fileInput = document.getElementById('file');
    const submitBtn = document.getElementById('submit');
    const downloadBtn = document.getElementById('download');
    const statusEl = document.getElementById('status');

    let partners = [], selectedPartnerId = '', listHighlight = -1, resultBlob = null, resultName = 'result_dsp.xlsx';

    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const getP = () => partners.find(x => x.id === selectedPartnerId);

    const setStatus = (text, kind) => {
      if (!text) {
        statusEl.className = 'd-none';
        statusEl.textContent = '';
        return;
      }
      const cls = kind === 'error' ? 'alert-danger'
        : kind === 'warn' ? 'alert-warning'
        : kind === 'ok' ? 'alert-success' : 'alert-info';
      statusEl.className = `alert mt-3 mb-0 py-2 ${cls}`;
      statusEl.textContent = text;
    };

    const showDownload = (show) => {
      downloadBtn.hidden = !show;
      downloadBtn.classList.toggle('d-none', !show);
      downloadBtn.disabled = !show;
    };

    const clearResult = () => { resultBlob = null; showDownload(false); };

    const filter = q => {
      const n = q.trim().toLowerCase();
      return n ? partners.filter(p => p.display_name.toLowerCase().includes(n)) : partners.slice();
    };

    const openList = () => {
      partnerList.hidden = false;
      partnerList.classList.add('show');
    };

    const closeList = () => {
      partnerList.hidden = true;
      partnerList.classList.remove('show');
      listHighlight = -1;
    };

    const renderList = items => {
      partnerList.innerHTML = '';
      if (!items.length) {
        partnerList.innerHTML = '<li><span class="dropdown-item-text text-muted">Ничего не найдено</span></li>';
        return;
      }
      items.forEach(p => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-item';
        btn.textContent = p.display_name;
        btn.dataset.id = p.id;
        btn.addEventListener('mousedown', e => { e.preventDefault(); selectPartner(p); });
        li.appendChild(btn);
        partnerList.appendChild(li);
      });
    };

    const selectPartner = p => {
      selectedPartnerId = p.id;
      partnerSearch.value = p.display_name;
      closeList();
      onPartnerChange();
    };

    const syncInput = () => {
      const q = partnerSearch.value.trim().toLowerCase();
      const ex = partners.find(p => p.display_name.toLowerCase() === q);
      if (ex) {
        if (selectedPartnerId !== ex.id) selectPartner(ex);
        return true;
      }
      if (selectedPartnerId && getP()?.display_name.toLowerCase() !== q) {
        selectedPartnerId = '';
        renderInfo(null);
        submitBtn.disabled = true;
      }
      return !!selectedPartnerId;
    };

    const renderInfo = p => {
      if (!p) {
        infoEl.classList.add('d-none');
        infoEl.hidden = true;
        submitBtn.disabled = true;
        return;
      }
      const ord = p.report_to_ord === true ? 'Да' : p.report_to_ord === false ? 'Нет' : '—';
      const warn = p.has_profile ? '' : '<div class="alert alert-warning py-2 px-3 mt-2 mb-0 small">Преобразование недоступно — нужен образец выгрузки.</div>';
      infoEl.innerHTML = `<dl class="row mb-0 small">
        <dt class="col-sm-4">DSP ID</dt><dd class="col-sm-8">${esc((p.dsp_ids||[]).join(', '))}</dd>
        <dt class="col-sm-4">Договор</dt><dd class="col-sm-8">${esc(p.contract||'—')}</dd>
        <dt class="col-sm-4">ОРД</dt><dd class="col-sm-8">${ord}</dd>
        <dt class="col-sm-4">URL</dt><dd class="col-sm-8">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>` : '—'}</dd>
      </dl>${warn}`;
      infoEl.classList.remove('d-none');
      infoEl.hidden = false;
      submitBtn.disabled = !p.has_profile;
    };

    const onPartnerChange = () => { clearResult(); setStatus('', ''); renderInfo(getP()); };

    partnerSearch.addEventListener('focus', () => { renderList(filter(partnerSearch.value)); openList(); });
    partnerSearch.addEventListener('input', () => {
      clearResult(); setStatus('', '');
      const f = filter(partnerSearch.value);
      renderList(f);
      listHighlight = f.length ? 0 : -1;
      openList();
      syncInput();
    });
    partnerSearch.addEventListener('blur', () => setTimeout(() => {
      closeList();
      if (!syncInput() && partnerSearch.value.trim()) setStatus('Выберите DSP из списка', 'error');
    }, 150));

    partnerSearch.addEventListener('keydown', e => {
      const items = partnerList.querySelectorAll('.dropdown-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (partnerList.hidden) { renderList(filter(partnerSearch.value)); openList(); }
        if (items.length) {
          listHighlight = Math.min(listHighlight + 1, items.length - 1);
          items.forEach((el, i) => el.classList.toggle('active', i === listHighlight));
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length) {
          listHighlight = Math.max(listHighlight - 1, 0);
          items.forEach((el, i) => el.classList.toggle('active', i === listHighlight));
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (!partnerList.hidden && listHighlight >= 0 && items[listHighlight]) {
          const p = partners.find(x => x.id === items[listHighlight].dataset.id);
          if (p) selectPartner(p);
        } else {
          const f = filter(partnerSearch.value);
          if (f.length === 1) selectPartner(f[0]);
          else syncInput();
        }
      } else if (e.key === 'Escape') closeList();
    });

    fileInput.addEventListener('change', () => { clearResult(); setStatus('', ''); });

    submitBtn.addEventListener('click', async () => {
      if (!fileInput.files[0]) return setStatus('Выберите файл', 'error');
      if (!syncInput()) return setStatus('Выберите DSP из списка', 'error');
      if (!getP()?.has_profile) return setStatus('Профиль преобразования не настроен', 'error');

      clearResult();
      submitBtn.disabled = true;
      showDownload(false);
      const prevLabel = submitBtn.textContent;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Обработка…';
      setStatus('', '');

      const form = new FormData();
      form.append('file', fileInput.files[0]);
      form.append('partner_id', selectedPartnerId);

      try {
        const res = await fetch('/api/transform', { method: 'POST', body: form });
        if (!res.ok) {
          let msg = `Ошибка ${res.status}`;
          try {
            const err = await res.json();
            if (typeof err.detail === 'string') msg = err.detail;
          } catch (_) {
            msg = await res.text() || msg;
          }
          setStatus(msg, 'error');
          return;
        }
        resultBlob = await res.blob();
        const rows = res.headers.get('X-Rows-Written');
        const valErrs = parseInt(res.headers.get('X-Validation-Error-Count') || '0', 10);
        const m = res.headers.get('Content-Disposition')?.match(/filename="?([^";\n]+)"?/i);
        resultName = m ? decodeURIComponent(m[1].trim()) : fileInput.files[0].name.replace(/\.xlsx?$/i, '') + '_dsp.xlsx';
        showDownload(true);
        let msg = rows ? `Готово: ${rows} строк. Нажмите «Скачать результат».` : 'Готово. Нажмите «Скачать результат».';
        setStatus(msg, valErrs > 0 ? 'warn' : 'ok');
        if (valErrs > 0) statusEl.textContent += ` Замечаний проверки шаблона: ${valErrs}.`;
      } catch (e) {
        setStatus('Сеть: ' + e.message, 'error');
      } finally {
        submitBtn.innerHTML = prevLabel;
        submitBtn.disabled = !getP()?.has_profile;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultBlob) return;
      const u = URL.createObjectURL(resultBlob);
      const a = document.createElement('a');
      a.href = u;
      a.download = resultName;
      a.click();
      URL.revokeObjectURL(u);
    });

    fetch('/api/partners').then(r => r.json()).then(d => {
      partners = (d.partners || []).slice().sort((a, b) => a.display_name.localeCompare(b.display_name, 'ru'));
      if (!partners.length) return setStatus('Справочник DSP пуст', 'error');
      const preferred = partners.find(p => p.id === 'buzzoola') || partners.find(p => p.has_profile) || partners[0];
      selectPartner(preferred);
    }).catch(e => setStatus('Ошибка загрузки списка DSP: ' + e.message, 'error'));
  </script>
</body>
</html>
