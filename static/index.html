<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Преобразование данных DSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #1a4a7a;
      --bs-primary-rgb: 26, 74, 122;
      --bs-success: #2d6a4f;
      --bs-body-bg: #eef1f6;
      --bs-border-radius: 4px;
      --bs-font-sans-serif: "PT Sans", "Segoe UI", system-ui, sans-serif;
      --erir-header: #153d66;
    }
    body { min-height: 100vh; }
    .app-header {
      background: linear-gradient(180deg, var(--erir-header) 0%, #1a4a7a 100%);
      border-bottom: 3px solid #0f2d4a;
    }
    .app-header .subtitle { font-size: 0.8125rem; opacity: 0.85; }
    main { max-width: 44rem; }
    .card { border: 1px solid #d4dbe5; box-shadow: 0 1px 3px rgba(15, 45, 74, 0.08); }
    .card-header { background: #f8fafc; font-weight: 700; color: var(--erir-header); }
    .form-label { font-weight: 700; color: #374151; font-size: 0.875rem; }
    .steps {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .step {
      flex: 1 1 auto;
      min-width: 4.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      padding: 0.35rem 0.5rem;
      border-radius: var(--bs-border-radius);
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }
    .step.active { background: #e8f0f8; color: var(--erir-header); border-color: #b8cfe8; font-weight: 700; }
    .step.done { background: #ecfdf5; color: #166534; border-color: #bbf7d0; }
    .combobox-list { max-height: 14rem; overflow-y: auto; }
    .combobox-list .dropdown-item.active,
    .combobox-list .dropdown-item:hover { background: #e8f0f8; color: #153d66; }
    .info-panel .info-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: var(--erir-header);
      font-size: 0.875rem;
    }
    .info-panel dt { font-weight: 700; color: #4b5563; font-size: 0.8125rem; }
    .drop-zone {
      border: 2px dashed #c5cdd8;
      border-radius: var(--bs-border-radius);
      padding: 1.25rem 1rem;
      text-align: center;
      background: #fafbfc;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--bs-primary);
      background: #f0f6fc;
    }
    .drop-zone.has-file { border-style: solid; border-color: #94b8d9; background: #fff; text-align: left; }
    .drop-zone input[type=file] { display: none; }
    .file-meta { font-size: 0.875rem; word-break: break-all; }
    .file-meta .name { font-weight: 700; color: #1f2937; }
    .file-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .file-row .file-info { flex: 1; min-width: 0; }
    .file-remove {
      flex-shrink: 0;
      margin: -0.25rem -0.25rem 0 0;
      opacity: 0.55;
    }
    .file-remove:hover { opacity: 1; }
    .result-block {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: var(--bs-border-radius);
      padding: 1rem;
    }
    .result-block.d-none { display: none !important; }
    #download { font-weight: 700; }
    .validation-list {
      max-height: 10rem;
      overflow-y: auto;
      font-size: 0.8125rem;
      color: #991b1b;
    }
  </style>
</head>
<body class="d-flex flex-column">
  <header class="app-header navbar navbar-dark py-3 mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fs-5">Преобразование данных DSP</span>
      <div class="subtitle text-white-50 mt-1">Выгрузка партнёра → шаблон загрузки</div>
    </div>
  </header>

  <main class="container flex-grow-1 pb-5">
    <div class="card">
      <div class="card-header">Загрузка и преобразование</div>
      <div class="card-body">
        <nav class="steps" aria-label="Шаги">
          <div class="step active" id="step-dsp">1. DSP</div>
          <div class="step" id="step-file">2. Файл</div>
          <div class="step" id="step-run">3. Обработка</div>
          <div class="step" id="step-dl">4. Скачать</div>
        </nav>

        <section class="mb-3" aria-labelledby="lbl-dsp">
          <label for="partner-search" class="form-label" id="lbl-dsp">DSP</label>
          <div class="combobox position-relative">
            <input type="text" class="form-control" id="partner-search" autocomplete="off"
                   placeholder="Начните вводить название…" />
            <ul id="partner-list" class="dropdown-menu combobox-list w-100 shadow-sm" hidden></ul>
          </div>
        </section>

        <div id="info" class="info-panel alert alert-light border mb-3 d-none" role="region" aria-live="polite"></div>

        <section class="mb-3" aria-labelledby="lbl-period">
          <span class="form-label d-block" id="lbl-period">Отчётный период</span>
          <div class="row g-2">
            <div class="col-7">
              <label for="report-month" class="form-label small text-muted mb-1">Месяц</label>
              <select class="form-select" id="report-month" required></select>
            </div>
            <div class="col-5">
              <label for="report-year" class="form-label small text-muted mb-1">Год</label>
              <select class="form-select" id="report-year" required></select>
            </div>
          </div>
          <div class="form-text" id="output-name-preview"></div>
        </section>

        <section class="mb-4" aria-labelledby="lbl-file">
          <span class="form-label d-block" id="lbl-file">Файл выгрузки</span>
          <div class="drop-zone" id="drop-zone" tabindex="0" role="button"
               aria-label="Выберите или перетащите файл Excel">
            <input type="file" id="file" accept=".xlsx,.xlsm,.xls" />
            <div id="drop-placeholder">
              <div class="text-muted small">Перетащите файл сюда или нажмите для выбора</div>
              <div class="text-muted small mt-1">Формат: .xlsx, .xlsm, .xls</div>
            </div>
            <div id="drop-selected" class="file-meta d-none">
              <div class="file-row">
                <div class="file-info">
                  <div class="name" id="file-name"></div>
                  <div class="text-muted small" id="file-size"></div>
                </div>
                <button type="button" class="btn-close file-remove" id="file-remove"
                        aria-label="Удалить файл" title="Удалить файл"></button>
              </div>
            </div>
          </div>
        </section>

        <div class="d-grid gap-2 mb-2">
          <button type="button" class="btn btn-primary btn-lg" id="submit" disabled>Преобразовать</button>
          <button type="button" class="btn btn-outline-secondary" id="save-sample" disabled>
            Сохранить маппинг полей
          </button>
        </div>
        <p class="form-text mb-0" id="sample-name-preview"></p>

        <div id="result-block" class="result-block d-none" aria-live="polite">
          <p class="small text-success mb-2 mb-md-3" id="result-hint"></p>
          <div id="validation-errors" class="d-none mb-2">
            <div class="small fw-bold text-danger">Замечания проверки шаблона</div>
            <ul id="validation-errors-list" class="validation-list mb-2 ps-3"></ul>
          </div>
          <button type="button" class="btn btn-success btn-lg w-100" id="download">Скачать результат</button>
          <button type="button" class="btn btn-outline-warning w-100 mt-2 d-none" id="download-force">
            Скачать с замечаниями
          </button>
        </div>

        <div id="status" class="d-none mt-3" role="status"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const partnerSearch = document.getElementById('partner-search');
    const partnerList = document.getElementById('partner-list');
    const infoEl = document.getElementById('info');
    const fileInput = document.getElementById('file');
    const dropZone = document.getElementById('drop-zone');
    const dropPlaceholder = document.getElementById('drop-placeholder');
    const dropSelected = document.getElementById('drop-selected');
    const fileNameEl = document.getElementById('file-name');
    const fileSizeEl = document.getElementById('file-size');
    const fileRemoveBtn = document.getElementById('file-remove');
    const submitBtn = document.getElementById('submit');
    const saveSampleBtn = document.getElementById('save-sample');
    const sampleNamePreview = document.getElementById('sample-name-preview');
    const resultBlock = document.getElementById('result-block');
    const resultHint = document.getElementById('result-hint');
    const downloadBtn = document.getElementById('download');
    const downloadForceBtn = document.getElementById('download-force');
    const validationErrorsEl = document.getElementById('validation-errors');
    const validationErrorsList = document.getElementById('validation-errors-list');
    const statusEl = document.getElementById('status');
    const reportMonth = document.getElementById('report-month');
    const reportYear = document.getElementById('report-year');
    const outputNamePreview = document.getElementById('output-name-preview');

    const MONTH_SLUG = ['', 'jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const MONTH_LABEL = ['', 'Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const steps = {
      dsp: document.getElementById('step-dsp'),
      file: document.getElementById('step-file'),
      run: document.getElementById('step-run'),
      dl: document.getElementById('step-dl'),
    };

    let partners = [], selectedPartnerId = '', listHighlight = -1;
    let resultBlob = null, resultName = 'result_dsp.xlsx';
    let validationErrors = [];

    const parseValidationHeader = value => {
      if (!value) return [];
      try {
        const parsed = JSON.parse(atob(value));
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    };

    const parseApiErrorBody = (buffer, status) => {
      let msg = `Ошибка ${status}`;
      if (!buffer || !buffer.byteLength) return msg;
      const text = new TextDecoder().decode(buffer);
      if (!text) return msg;
      try {
        const err = JSON.parse(text);
        if (typeof err.detail === 'string') return err.detail;
        if (Array.isArray(err.detail)) {
          return err.detail
            .map(d => (typeof d === 'string' ? d : (d.msg || JSON.stringify(d))))
            .join('; ');
        }
      } catch (_) {
        return text.length > 300 ? text.slice(0, 300) + '…' : text;
      }
      return msg;
    };

    const formatDuration = ms => {
      const n = Number(ms);
      if (!Number.isFinite(n) || n < 0) return '';
      if (n < 1000) return `${(n / 1000).toFixed(1).replace('.', ',')} с`;
      if (n < 60000) return `${(n / 1000).toFixed(1).replace('.', ',')} с`;
      const min = Math.floor(n / 60000);
      const sec = Math.round((n % 60000) / 1000);
      return sec ? `${min} мин ${sec} с` : `${min} мин`;
    };

    const parseFilenameFromDisposition = header => {
      if (!header) return null;
      const star = header.match(/filename\*=UTF-8''([^;\n]+)/i);
      if (star) {
        try { return decodeURIComponent(star[1].trim()); } catch (_) { return star[1].trim(); }
      }
      const plain = header.match(/filename="?([^";\n]+)"?/i);
      return plain ? plain[1].trim() : null;
    };

    const renderValidationErrors = errors => {
      validationErrors = errors;
      if (!errors.length) {
        validationErrorsEl.classList.add('d-none');
        validationErrorsList.innerHTML = '';
        downloadBtn.classList.remove('d-none');
        downloadForceBtn.classList.add('d-none');
        downloadBtn.disabled = !resultBlob;
        return;
      }
      validationErrorsEl.classList.remove('d-none');
      const shown = errors.slice(0, 30);
      validationErrorsList.innerHTML = shown.map(e => `<li>${esc(e)}</li>`).join('')
        + (errors.length > 30 ? `<li class="text-muted">…и ещё ${errors.length - 30}</li>` : '');
      downloadBtn.classList.add('d-none');
      downloadForceBtn.classList.remove('d-none');
      downloadForceBtn.disabled = !resultBlob;
    };

    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const getP = () => partners.find(x => x.id === selectedPartnerId);

    const setSteps = (active) => {
      const order = ['dsp', 'file', 'run', 'dl'];
      const idx = order.indexOf(active);
      order.forEach((key, i) => {
        steps[key].classList.remove('active', 'done');
        if (i < idx) steps[key].classList.add('done');
        else if (i === idx) steps[key].classList.add('active');
      });
    };

    const formatSize = bytes => {
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
    };

    const updateFileUI = () => {
      const file = fileInput.files[0];
      if (file) {
        dropZone.classList.add('has-file');
        dropPlaceholder.classList.add('d-none');
        dropSelected.classList.remove('d-none');
        fileNameEl.textContent = file.name;
        fileSizeEl.textContent = formatSize(file.size);
        setSteps('file');
      } else {
        dropZone.classList.remove('has-file');
        dropPlaceholder.classList.remove('d-none');
        dropSelected.classList.add('d-none');
        if (selectedPartnerId) setSteps('dsp');
      }
      updateSubmitState();
    };

    const buildOutputName = () => {
      if (!selectedPartnerId || !reportMonth.value || !reportYear.value) return '';
      const m = parseInt(reportMonth.value, 10);
      return `${selectedPartnerId}_${MONTH_SLUG[m]}_${reportYear.value}.xlsx`;
    };

    const updateOutputPreview = () => {
      const name = buildOutputName();
      outputNamePreview.textContent = name
        ? `Имя файла после обработки: ${name}`
        : '';
    };

    const initReportPeriod = () => {
      const now = new Date();
      reportMonth.innerHTML = MONTH_LABEL.slice(1).map((label, i) =>
        `<option value="${i + 1}">${label}</option>`
      ).join('');
      reportMonth.value = String(now.getMonth() + 1);

      const y = now.getFullYear();
      reportYear.innerHTML = '';
      for (let year = y - 3; year <= y + 1; year++) {
        const opt = document.createElement('option');
        opt.value = String(year);
        opt.textContent = String(year);
        reportYear.appendChild(opt);
      }
      reportYear.value = String(y);
      updateOutputPreview();
    };

    const buildSampleName = () => {
      if (!selectedPartnerId || !fileInput.files[0]) return '';
      const ext = (fileInput.files[0].name.match(/\.[^.]+$/i) || ['.xlsx'])[0].toLowerCase();
      const allowed = ['.xlsx', '.xlsm', '.xls'];
      const safeExt = allowed.includes(ext) ? ext : '.xlsx';
      return `${selectedPartnerId}${safeExt}`;
    };

    const updateSamplePreview = () => {
      const name = buildSampleName();
      const p = getP();
      sampleNamePreview.textContent = name && p && !p.has_profile
        ? `Будет сохранён файл: ${name}`
        : '';
    };

    const updateSubmitState = () => {
      const p = getP();
      const hasFile = !!fileInput.files[0];
      submitBtn.disabled = !(p?.has_profile && hasFile);
      const sampleAllowed = !!(p && !p.has_profile);
      saveSampleBtn.classList.toggle('d-none', !sampleAllowed);
      saveSampleBtn.disabled = !(sampleAllowed && hasFile);
      updateOutputPreview();
      updateSamplePreview();
    };

    const setStatus = (text, kind) => {
      if (!text) {
        statusEl.className = 'd-none';
        statusEl.textContent = '';
        return;
      }
      const cls = kind === 'error' ? 'alert-danger'
        : kind === 'warn' ? 'alert-warning'
        : kind === 'ok' ? 'alert-success' : 'alert-info';
      statusEl.className = `alert py-2 mb-0 ${cls}`;
      statusEl.textContent = text;
    };

    const showResult = (show, hint = '') => {
      resultBlock.classList.toggle('d-none', !show);
      if (hint) resultHint.textContent = hint;
      if (show) setSteps('dl');
      else if (fileInput.files[0] && selectedPartnerId) setSteps('file');
    };

    const clearResult = () => {
      resultBlob = null;
      renderValidationErrors([]);
      showResult(false);
    };

    const filter = q => {
      const n = q.trim().toLowerCase();
      return n ? partners.filter(p => p.display_name.toLowerCase().includes(n)) : partners.slice();
    };

    const openList = () => { partnerList.hidden = false; partnerList.classList.add('show'); };
    const closeList = () => { partnerList.hidden = true; partnerList.classList.remove('show'); listHighlight = -1; };

    const renderList = items => {
      partnerList.innerHTML = '';
      if (!items.length) {
        partnerList.innerHTML = '<li><span class="dropdown-item-text text-muted">Ничего не найдено</span></li>';
        return;
      }
      items.forEach(p => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-item';
        btn.textContent = p.display_name;
        btn.dataset.id = p.id;
        btn.addEventListener('mousedown', e => { e.preventDefault(); selectPartner(p); });
        li.appendChild(btn);
        partnerList.appendChild(li);
      });
    };

    const selectPartner = p => {
      selectedPartnerId = p.id;
      partnerSearch.value = p.display_name;
      closeList();
      onPartnerChange();
    };

    const syncInput = () => {
      const q = partnerSearch.value.trim().toLowerCase();
      const ex = partners.find(p => p.display_name.toLowerCase() === q);
      if (ex) {
        if (selectedPartnerId !== ex.id) selectPartner(ex);
        return true;
      }
      if (selectedPartnerId && getP()?.display_name.toLowerCase() !== q) {
        selectedPartnerId = '';
        renderInfo(null);
      }
      updateSubmitState();
      return !!selectedPartnerId;
    };

    const renderInfo = p => {
      if (!p) {
        infoEl.classList.add('d-none');
        updateSubmitState();
        return;
      }
      const ord = p.report_to_ord === true ? 'Да' : p.report_to_ord === false ? 'Нет' : '—';
      const badge = p.has_profile
        ? '<span class="badge text-bg-success">Преобразование доступно</span>'
        : '<span class="badge text-bg-secondary">Профиль не настроен</span>';
      const warn = p.has_profile ? '' : '<div class="alert alert-warning py-2 px-3 mt-2 mb-0 small">Профиль не настроен. Загрузите файл выше и нажмите «Сохранить маппинг полей» — по образцу добавим маппинг.</div>';
      infoEl.innerHTML = `
        <div class="info-title"><span>Данные из справочника</span>${badge}</div>
        <dl class="row mb-0 small g-1">
          <dt class="col-12 col-md-5">DSP ID</dt><dd class="col-12 col-md-7">${esc((p.dsp_ids||[]).join(', '))}</dd>
          <dt class="col-12 col-md-5">Договор</dt><dd class="col-12 col-md-7">${esc(p.contract||'—')}</dd>
          <dt class="col-12 col-md-5">Отчитываемся в ОРД</dt><dd class="col-12 col-md-7">${ord}</dd>
          <dt class="col-12 col-md-5">URL</dt><dd class="col-12 col-md-7">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>` : '—'}</dd>
        </dl>${warn}`;
      infoEl.classList.remove('d-none');
      setSteps(fileInput.files[0] ? 'file' : 'dsp');
      updateSubmitState();
    };

    const onPartnerChange = () => { clearResult(); setStatus('', ''); renderInfo(getP()); updateOutputPreview(); };

    reportMonth.addEventListener('change', () => { updateOutputPreview(); });
    reportYear.addEventListener('change', () => { updateOutputPreview(); });

    const clearFile = () => {
      fileInput.value = '';
      updateFileUI();
      clearResult();
      setStatus('', '');
    };

    dropZone.addEventListener('click', e => {
      if (e.target.closest('#file-remove')) return;
      fileInput.click();
    });
    dropZone.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    fileRemoveBtn.addEventListener('click', e => {
      e.stopPropagation();
      clearFile();
    });
    fileInput.addEventListener('change', () => { updateFileUI(); clearResult(); setStatus('', ''); });

    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    });
    dropZone.addEventListener('drop', e => {
      const f = e.dataTransfer?.files?.[0];
      if (f && /\.(xlsx|xlsm|xls)$/i.test(f.name)) {
        const dt = new DataTransfer();
        dt.items.add(f);
        fileInput.files = dt.files;
        updateFileUI();
        clearResult();
        setStatus('', '');
      } else setStatus('Нужен файл .xlsx, .xlsm или .xls', 'error');
    });

    partnerSearch.addEventListener('focus', () => { renderList(filter(partnerSearch.value)); openList(); });
    partnerSearch.addEventListener('input', () => {
      clearResult(); setStatus('', '');
      renderList(filter(partnerSearch.value));
      listHighlight = filter(partnerSearch.value).length ? 0 : -1;
      openList();
      syncInput();
    });
    partnerSearch.addEventListener('blur', () => setTimeout(() => {
      closeList();
      if (!syncInput() && partnerSearch.value.trim()) setStatus('Выберите DSP из списка', 'error');
    }, 150));
    partnerSearch.addEventListener('keydown', e => {
      const items = partnerList.querySelectorAll('.dropdown-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (partnerList.hidden) { renderList(filter(partnerSearch.value)); openList(); }
        if (items.length) {
          listHighlight = Math.min(listHighlight + 1, items.length - 1);
          items.forEach((el, i) => el.classList.toggle('active', i === listHighlight));
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length) {
          listHighlight = Math.max(listHighlight - 1, 0);
          items.forEach((el, i) => el.classList.toggle('active', i === listHighlight));
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (!partnerList.hidden && listHighlight >= 0 && items[listHighlight]) {
          const p = partners.find(x => x.id === items[listHighlight].dataset.id);
          if (p) selectPartner(p);
        } else {
          const f = filter(partnerSearch.value);
          if (f.length === 1) selectPartner(f[0]);
          else syncInput();
        }
      } else if (e.key === 'Escape') closeList();
    });

    saveSampleBtn.addEventListener('click', async () => {
      if (!fileInput.files[0]) return setStatus('Выберите файл', 'error');
      if (!syncInput()) return setStatus('Выберите DSP из списка', 'error');
      if (getP()?.has_profile) return setStatus('Для этого DSP преобразование уже настроено', 'error');

      saveSampleBtn.disabled = true;
      const prevHtml = saveSampleBtn.innerHTML;
      saveSampleBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Сохранение…';
      setStatus('Сохранение маппинга полей…', 'info');

      const form = new FormData();
      form.append('file', fileInput.files[0]);
      form.append('partner_id', selectedPartnerId);

      try {
        const res = await fetch('/api/source-data', { method: 'POST', body: form });
        const buffer = await res.arrayBuffer();
        if (!res.ok) {
          setStatus(parseApiErrorBody(buffer, res.status), 'error');
          return;
        }
        let data = {};
        try {
          data = JSON.parse(new TextDecoder().decode(buffer));
        } catch (_) {}
        setStatus(data.message || 'Файл сохранён', 'ok');
      } catch (e) {
        setStatus('Сеть: ' + e.message, 'error');
      } finally {
        saveSampleBtn.innerHTML = prevHtml;
        updateSubmitState();
      }
    });

    submitBtn.addEventListener('click', async () => {
      if (!fileInput.files[0]) return setStatus('Выберите файл', 'error');
      if (!syncInput()) return setStatus('Выберите DSP из списка', 'error');
      if (!getP()?.has_profile) return setStatus('Профиль преобразования не настроен', 'error');

      clearResult();
      submitBtn.disabled = true;
      const prevHtml = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Обработка…';
      setStatus('Идёт преобразование, подождите…', 'info');
      setSteps('run');

      const form = new FormData();
      form.append('file', fileInput.files[0]);
      form.append('partner_id', selectedPartnerId);
      form.append('report_month', reportMonth.value);
      form.append('report_year', reportYear.value);

      const transformStarted = performance.now();
      try {
        const res = await fetch('/api/transform', { method: 'POST', body: form });
        const buffer = await res.arrayBuffer();
        const totalMs = Math.round(performance.now() - transformStarted);
        if (!res.ok) {
          setStatus(parseApiErrorBody(buffer, res.status), 'error');
          setSteps('file');
          return;
        }
        const mime = res.headers.get('Content-Type')
          || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        resultBlob = new Blob([buffer], { type: mime });
        const rows = res.headers.get('X-Rows-Written');
        const skippedEmpty = parseInt(res.headers.get('X-Skipped-Empty-Rows') || '0', 10);
        const valErrs = parseInt(res.headers.get('X-Validation-Error-Count') || '0', 10);
        const valList = parseValidationHeader(res.headers.get('X-Validation-Errors'));
        const processMs = parseInt(res.headers.get('X-Process-Time-Ms') || '0', 10);
        resultName = parseFilenameFromDisposition(res.headers.get('Content-Disposition'))
          || buildOutputName() || 'result_dsp.xlsx';

        const parts = [];
        if (rows) parts.push(`Записано строк: ${rows}`);
        parts.push(`Пустых строк во входе (пропущено): ${skippedEmpty}`);
        const processLabel = formatDuration(processMs || totalMs);
        if (processLabel) {
          parts.push(`Время преобразования: ${processLabel}`);
          if (processMs > 0 && totalMs > processMs + 500) {
            parts.push(`всего с загрузкой: ${formatDuration(totalMs)}`);
          }
        }
        let hint = parts.join(' · ');
        if (valErrs > 0) {
          hint += '. Исправьте замечания ниже или скачайте файл с оговоркой.';
        } else {
          hint += '. Нажмите кнопку ниже для скачивания.';
        }
        showResult(true, hint);
        renderValidationErrors(valList.length ? valList : (valErrs > 0 ? [`Всего замечаний: ${valErrs}`] : []));

        if (valErrs > 0) {
          setStatus(`Готово. Замечаний проверки: ${valErrs}.`, 'warn');
        } else {
          setStatus('Преобразование завершено успешно.', 'ok');
        }
      } catch (e) {
        setStatus('Сеть: ' + e.message, 'error');
        setSteps('file');
      } finally {
        submitBtn.innerHTML = prevHtml;
        updateSubmitState();
      }
    });

    const triggerDownload = () => {
      if (!resultBlob) return;
      const u = URL.createObjectURL(resultBlob);
      const a = document.createElement('a');
      a.href = u;
      a.download = resultName;
      a.click();
      URL.revokeObjectURL(u);
    };

    downloadBtn.addEventListener('click', triggerDownload);
    downloadForceBtn.addEventListener('click', triggerDownload);

    initReportPeriod();

    fetch('/api/partners').then(r => r.json()).then(d => {
      partners = (d.partners || []).slice().sort((a, b) => a.display_name.localeCompare(b.display_name, 'ru'));
      if (!partners.length) return setStatus('Справочник DSP пуст', 'error');
      if ((d.warnings || []).length) {
        setStatus('Справочник: ' + d.warnings.join('; '), 'warn');
      }
      const preferred = partners.find(p => p.has_profile) || partners[0];
      selectPartner(preferred);
      setSteps('dsp');
    }).catch(e => setStatus('Ошибка загрузки списка DSP: ' + e.message, 'error'));
  </script>
</body>
</html>
