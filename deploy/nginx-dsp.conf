# Фрагмент для /etc/nginx/sites-available/dsp
# Нужен из-за кастомных заголовков X-Validation-* при преобразовании.
#
# Лимит тела запроса должен быть не меньше лимита приложения (50 МБ).
# Basic auth лучше задать и в приложении (DSP_BASIC_USER / DSP_BASIC_PASSWORD),
# и здесь: auth_basic "DSP"; auth_basic_user_file /etc/nginx/.htpasswd;

client_max_body_size 50m;
underscores_in_headers on;

location / {
    proxy_pass http://127.0.0.1:5555;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
}
